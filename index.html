<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Cancer Care Assistant</title>
    <style>
        :root {
            --primary-blue: #0056b3;
            --light-blue: #e8f4ff;
            --primary-green: #2e7d32;
            --bg-color: #f0f2f5;
            --text-dark: #1a1a1a;
            --white: #ffffff;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-dark); 
            margin: 0; 
            padding: 20px; 
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        #app-wrapper {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e0e0e0;
        }

        .header {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 16px;
            opacity: 0.9;
        }

        #chat-box {
            padding: 25px;
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fafafa;
        }

        .message {
            max-width: 80%;
            padding: 18px 24px;
            border-radius: 20px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot { 
            background-color: var(--light-blue); 
            color: #003d82;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user { 
            background-color: var(--primary-blue); 
            color: var(--white);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .quick-ask { 
            padding: 20px 25px;
            background: var(--white);
            border-top: 1px solid #eee;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-ask button { 
            background-color: var(--white); 
            color: var(--primary-blue); 
            border: 2px solid var(--primary-blue); 
            padding: 12px 20px; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.2s; 
        }

        .quick-ask button:hover, .quick-ask button:focus { 
            background-color: var(--primary-blue);
            color: var(--white);
            outline: none;
            box-shadow: 0 4px 8px rgba(0,86,179,0.2);
        }

        #input-area { 
            display: flex; 
            padding: 20px 25px;
            background: var(--white);
            border-top: 1px solid #eee;
        }

        input { 
            flex: 1; 
            padding: 16px 20px; 
            font-size: 20px; 
            border: 2px solid #ccc; 
            border-radius: 30px 0 0 30px; 
            color: var(--text-dark);
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        #send-btn { 
            border-radius: 0 30px 30px 0; 
            margin: 0; 
            background-color: var(--primary-green); 
            color: var(--white);
            border: 2px solid var(--primary-green);
            padding: 0 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #send-btn:hover { 
            background-color: #1b471e; 
        }

        /* Scrollbar styling for a cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #999; }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div class="header">
            <h1>Cancer Care Helper</h1>
            <p>Your digital companion for comfort and guidance</p>
        </div>
        
        <div id="chat-box">
            <div class="message bot">Hello. I am your digital care helper. You can ask me questions about your treatment, side effects, or click a quick topic below.</div>
        </div>
        
        <div class="quick-ask">
            <button onclick="askQuestion('Chemo Side Effects')">Chemo</button>
            <button onclick="askQuestion('Managing Pain')">Pain</button>
            <button onclick="askQuestion('Nutrition Tips')">Nutrition</button>
            <button onclick="askQuestion('When to call the doctor')">Emergency</button>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your question..." aria-label="Type your question">
            <button id="send-btn" onclick="handleCustomInput()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Expanded logic with if/else conditions for cancer-specific FAQs
        function getResponse(question) {
            const lowerQ = question.toLowerCase();
            
            if (lowerQ.includes("chemo") || lowerQ.includes("nausea") || lowerQ.includes("sick")) {
                return "Chemotherapy can cause nausea and fatigue. It is helpful to eat small, frequent meals rather than large ones. Ginger tea or peppermint can sometimes settle your stomach. Always tell your care team about your nausea so they can provide medication to help.";
            } 
            else if (lowerQ.includes("radiation") || lowerQ.includes("skin") || lowerQ.includes("burn")) {
                return "Radiation therapy can make your skin feel sensitive, similar to a sunburn. Wash the area gently with warm water and mild soap. Avoid rubbing, and only use specific lotions approved by your radiation oncologist.";
            } 
            else if (lowerQ.includes("pain") || lowerQ.includes("hurt") || lowerQ.includes("medication")) {
                return "Managing pain is vital for your healing. Take your prescribed pain medication on a regular schedule, even if you aren't in severe pain yet. Keep a written log of when you take them to share with your doctor.";
            } 
            else if (lowerQ.includes("hair") || lowerQ.includes("bald") || lowerQ.includes("wig")) {
                return "Hair loss is a common side effect of certain treatments. Use a soft hairbrush and mild shampoo. Many people find comfort in wearing soft caps to keep their head warm, or using scarves and wigs.";
            }
            else if (lowerQ.includes("fatigue") || lowerQ.includes("tired") || lowerQ.includes("sleep")) {
                return "Cancer-related fatigue is very common. Listen to your body and rest when you need to. However, light activity like a short daily walk can actually help boost your energy levels.";
            } 
            else if (lowerQ.includes("nutrition") || lowerQ.includes("food") || lowerQ.includes("eat") || lowerQ.includes("appetite")) {
                return "If your appetite is low, focus on high-protein, high-calorie foods. Smoothies, yogurts, and nutritional drinks can be easier to swallow. If food tastes metallic, try using plastic utensils instead of metal ones.";
            } 
            else if (lowerQ.includes("support") || lowerQ.includes("lonely") || lowerQ.includes("sad")) {
                return "It is completely normal to feel overwhelmed or sad. Connecting with a cancer support group or talking to an oncology social worker can provide great comfort. You do not have to go through this alone.";
            } 
            else if (lowerQ.includes("doctor") || lowerQ.includes("call") || lowerQ.includes("emergency") || lowerQ.includes("fever")) {
                return "CRITICAL: Call your doctor immediately if you develop a fever over 100.4°F (38°C), experience sudden shortness of breath, have severe new pain, or cannot keep fluids down for more than 24 hours.";
            } 
            else if (lowerQ.includes("hello") || lowerQ.includes("hi") || lowerQ.includes("hey")) {
                return "Hello! I am here to help. You can ask me about chemo, radiation, pain, fatigue, nutrition, or when to call the doctor.";
            } 
            else {
                return "I am a simple helper. Please try asking about specific topics like 'chemo', 'radiation', 'pain', 'fatigue', 'nutrition', or 'fever'.";
            }
        }

        function askQuestion(topic) {
            addMessage(topic, 'user');
            setTimeout(() => {
                addMessage(getResponse(topic), 'bot');
            }, 500);
        }

        function handleCustomInput() {
            const text = userInput.value.trim();
            if (text === "") return; 
            
            addMessage(text, 'user');
            userInput.value = ''; 
            
            setTimeout(() => {
                addMessage(getResponse(text), 'bot');
            }, 500);
        }

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                handleCustomInput();
            }
        });
    </script>
</body>
</html>
